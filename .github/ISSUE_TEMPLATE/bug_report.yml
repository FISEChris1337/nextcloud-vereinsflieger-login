name: Bug report
description: Report unexpected behavior or an error in Vereinsflieger Login.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please check the existing issues and describe what happened. This is a public issue tracker: do not include passwords, AppKeys, access tokens or personal member details.
  - type: input
    id: app-version
    attributes:
      label: Vereinsflieger Login version
      description: Find this in the app's admin settings under Maintenance & updates.
      placeholder: "0.6.7"
    validations:
      required: true
  - type: input
    id: nextcloud-version
    attributes:
      label: Nextcloud version
      placeholder: "35.0.1"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact error message if available, with personal details removed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/client, PHP version and hosting method, if known.
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant logs or additional details
      description: Include only the relevant excerpt. Remove credentials, tokens and personal member details.
      render: text
